<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODERINDE GOLD INTELLIGENCE</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#080b10;
      color:#eee;
      font-family:Arial,sans-serif;
    }
    header{
      padding:20px;
      border-bottom:1px solid #252a32;
      background:#0d1118;
    }
    h1{
      margin:0;
      color:#d8ad45;
      font-size:22px;
    }
    .sub{color:#89919d;margin-top:6px;font-size:13px}
    main{padding:16px;max-width:1200px;margin:auto}
    .status{
      padding:14px;
      border:1px solid #252a32;
      border-radius:10px;
      background:#0d1118;
      margin-bottom:16px;
    }
    .live{color:#39d98a}
    .error{color:#ff6262}
    .price{
      font-size:38px;
      font-weight:bold;
      color:#fff;
      margin:10px 0;
    }
    .buttons{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:15px 0;
    }
    button{
      background:#151a22;
      border:1px solid #343b46;
      color:#ddd;
      padding:10px 15px;
      border-radius:7px;
      cursor:pointer;
    }
    button.active{
      background:#d8ad45;
      color:#080b10;
      border-color:#d8ad45;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
    }
    .card{
      background:#0d1118;
      border:1px solid #252a32;
      border-radius:10px;
      padding:16px;
    }
    .label{
      color:#89919d;
      font-size:12px;
      text-transform:uppercase;
      margin-bottom:8px;
    }
    .value{
      font-size:20px;
      font-weight:bold;
    }
    canvas{
      width:100%;
      height:320px;
      background:#090d13;
      border:1px solid #252a32;
      border-radius:10px;
      margin:15px 0;
    }
    .decision{
      font-size:26px;
      font-weight:bold;
      color:#d8ad45;
    }
  </style>
</head>

<body>

<header>
  <h1>ODERINDE GOLD INTELLIGENCE</h1>
  <div class="sub">XAU/USD • Live Market Intelligence</div>
</header>

<main>

  <div class="status">
    Market feed:
    <strong id="feedStatus">CONNECTING...</strong>
  </div>

  <div class="card">
    <div class="label">XAU/USD</div>
    <div class="price" id="price">—</div>
    <div id="lastUpdate">Waiting for market data...</div>
  </div>

  <div class="buttons">
    <button data-tf="1m">1M</button>
    <button data-tf="5m" class="active">5M</button>
    <button data-tf="15m">15M</button>
    <button data-tf="30m">30M</button>
    <button data-tf="1h">1H</button>
    <button data-tf="4h">4H</button>
    <button data-tf="1d">1D</button>
  </div>

  <canvas id="chart"></canvas>

  <div class="grid">

    <div class="card">
      <div class="label">RSI 14</div>
      <div class="value" id="rsi">—</div>
    </div>

    <div class="card">
      <div class="label">MACD</div>
      <div class="value" id="macd">—</div>
    </div>

    <div class="card">
      <div class="label">MACD Signal</div>
      <div class="value" id="macdSignal">—</div>
    </div>

    <div class="card">
      <div class="label">Market Structure</div>
      <div class="value" id="structure">—</div>
    </div>

    <div class="card">
      <div class="label">Momentum</div>
      <div class="value" id="momentum">—</div>
    </div>

    <div class="card">
      <div class="label">Liquidity</div>
      <div class="value" id="liquidity">—</div>
    </div>

  </div>

  <div class="card" style="margin-top:15px">
    <div class="label">DECISION ENGINE</div>
    <div class="decision" id="decision">WAITING</div>

    <div class="grid" style="margin-top:15px">

      <div>
        <div class="label">Entry</div>
        <div class="value" id="entry">—</div>
      </div>

      <div>
        <div class="label">Stop Loss</div>
        <div class="value" id="sl">—</div>
      </div>

      <div>
        <div class="label">TP1</div>
        <div class="value" id="tp1">—</div>
      </div>

      <div>
        <div class="label">TP2</div>
        <div class="value" id="tp2">—</div>
      </div>

      <div>
        <div class="label">TP3</div>
        <div class="value" id="tp3">—</div>
      </div>

    </div>
  </div>

</main>

<script>

let candles=[];
let timeframe="5m";

const $=id=>document.getElementById(id);

function ema(values,period){
  if(values.length<period)return NaN;

  const multiplier=2/(period+1);
  let result=values.slice(0,period)
    .reduce((a,b)=>a+b,0)/period;

  for(let i=period;i<values.length;i++){
    result=(values[i]-result)*multiplier+result;
  }

  return result;
}

function calculateRSI(values,period=14){

  if(values.length<=period)return NaN;

  let gains=0;
  let losses=0;

  for(let i=1;i<=period;i++){
    const change=values[i]-values[i-1];

    if(change>=0) gains+=change;
    else losses-=change;
  }

  let avgGain=gains/period;
  let avgLoss=losses/period;

  for(let i=period+1;i<values.length;i++){

    const change=values[i]-values[i-1];

    const gain=Math.max(change,0);
    const loss=Math.max(-change,0);

    avgGain=(avgGain*(period-1)+gain)/period;
    avgLoss=(avgLoss*(period-1)+loss)/period;
  }

  if(avgLoss===0)return 100;

  const rs=avgGain/avgLoss;

  return 100-(100/(1+rs));
}

function calculateMACD(values){

  if(values.length<26){
    return {macd:NaN,signal:NaN};
  }

  const fast=ema(values,12);
  const slow=ema(values,26);

  const macd=fast-slow;

  return {
    macd,
    signal:macd
  };
}

function drawChart(data){

  const canvas=$("chart");
  const ctx=canvas.getContext("2d");

  const w=canvas.width=canvas.clientWidth*devicePixelRatio;
  const h=canvas.height=canvas.clientHeight*devicePixelRatio;

  ctx.clearRect(0,0,w,h);

  if(!data.length)return;

  const values=data.map(x=>x.c);

  const min=Math.min(...values);
  const max=Math.max(...values);

  const pad=30*devicePixelRatio;

  ctx.beginPath();

  values.forEach((value,i)=>{

    const x=pad+
      i/(values.length-1)*
      (w-pad*2);

    const y=
      h-pad-
      ((value-min)/(max-min||1))*
      (h-pad*2);

    if(i===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);

  });

  ctx.strokeStyle="#d8ad45";
  ctx.lineWidth=2*devicePixelRatio;
  ctx.stroke();
}

function update(data){

  if(!data.length)return;

  const closes=data.map(x=>x.c);

  const last=closes[closes.length-1];

  const rsi=calculateRSI(closes);

  const macd=calculateMACD(closes);

  $("price").textContent=last.toFixed(2);

  $("rsi").textContent=
    Number.isFinite(rsi)?rsi.toFixed(2):"—";

  $("macd").textContent=
    Number.isFinite(macd.macd)
      ?macd.macd.toFixed(4)
      :"—";

  $("macdSignal").textContent=
    Number.isFinite(macd.signal)
      ?macd.signal.toFixed(4)
      :"—";

  const first=closes[0];

  const change=last-first;

  $("momentum").textContent=
    change>0?"BULLISH":
    change<0?"BEARISH":
    "NEUTRAL";

  $("structure").textContent=
    change>0?"BULLISH":
    change<0?"BEARISH":
    "NEUTRAL";

  $("liquidity").textContent="MONITORING";

  $("entry").textContent=last.toFixed(2);

  $("decision").textContent=
    rsi>=55 && change>0
      ?"LONG BIAS":
    rsi<=45 && change<0
      ?"SHORT BIAS":
      "WAIT";

  $("lastUpdate").textContent=
    "Last update: "+
    new Date().toLocaleTimeString();

  drawChart(data);
}

async function load(){

  $("feedStatus").textContent="CONNECTING...";

  try{

    const response=
      await fetch(
        "/api/candles?interval="+
        encodeURIComponent(timeframe),
        {cache:"no-store"}
      );

    const text=await response.text();

    let data;

    try{
      data=JSON.parse(text);
    }catch{
      throw new Error(
        "Server returned invalid data."
      );
    }

    if(!response.ok){
      throw new Error(
        data.error||
        "Market feed request failed."
      );
    }

    if(
      !data.values||
      !Array.isArray(data.values)
    ){
      throw new Error(
        data.error||
        "No candle data returned."
      );
    }

    candles=data.values
      .map(x=>({
        t:x.datetime,
        o:Number(x.open),
        h:Number(x.high),
        l:Number(x.low),
        c:Number(x.close)
      }))
      .filter(x=>Number.isFinite(x.c));

    if(!candles.length){
      throw new Error(
        "Twelve Data returned no usable candles."
      );
    }

    $("feedStatus").textContent=
      "LIVE";

    $("feedStatus").className="live";

    update(candles);

  }catch(error){

    console.error(error);

    $("feedStatus").textContent=
      "ERROR: "+error.message;

    $("feedStatus").className="error";

    $("lastUpdate").textContent=
      "Check Render market-data connection.";

  }

}

document
  .querySelectorAll("button[data-tf]")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      document
        .querySelectorAll("button[data-tf]")
        .forEach(b=>b.classList.remove("active"));

      button.classList.add("active");

      timeframe=
        button.dataset.tf;

      load();

    });

  });

load();

setInterval(load,60000);

</script>

</body>
</html>
